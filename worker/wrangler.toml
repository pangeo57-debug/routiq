name = "routepal-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Origins allowed to call this Worker. Anything else is refused — with no
# allowlist configured the Worker refuses everything rather than defaulting to
# "*", which would hand the API key's quota to whoever found the URL.
[vars]
ALLOWED_ORIGINS = "https://pangeo57-debug.github.io,http://localhost:8080,http://127.0.0.1:8080"
CONTACT_UA = "RoutePal/1.0 (+https://github.com/pangeo57-debug/routiq)"

# Rate-limit counters. Short-lived keys only.
[[kv_namespaces]]
binding = "RATE"
id = "218eb62c49c1414a9caf8d1f3957c306"
preview_id = "7af59b59eb9640aaaa8cc62d230633df"

# Geocoding answers. Addresses do not move, so these are cached for a month —
# it keeps us well inside Nominatim's usage policy and off HERE's meter.
[[kv_namespaces]]
binding = "CACHE"
id = "b7d03bd8b4a2424f832ffe7bab54cb24"
preview_id = "068022b72ae84261adbd9f9b2ccaafdf"

# The HERE key is a SECRET, never a var:
#   npx wrangler secret put HERE_API_KEY

# Sync storage. D1 rather than KV: a device must read back what it just wrote,
# and KV is eventually consistent.
#   npx wrangler d1 create routepal-sync
#   npx wrangler d1 migrations apply routepal-sync --remote
[[d1_databases]]
binding = "DB"
database_name = "routepal-sync"
database_id = "d4a24b50-8706-4e12-99c3-f7dcd4819e69"

# Retention. Twelve months untouched and a space is deleted — see PRIVACY.md.
# Runs daily and deletes in bounded batches, so a backlog drains over days
# rather than vanishing in one irreversible sweep.
[triggers]
crons = ["17 3 * * *"]
