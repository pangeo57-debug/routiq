<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<!-- Content Security Policy.
     Read what this does and does not do. The app is one inline script block
     with 83 inline onclick handlers, and a static file served from GitHub Pages
     cannot carry a per-request nonce — so 'unsafe-inline' has to stay, and this
     policy does NOT prevent injected script from executing.
     What it does: script can only be LOADED from jsDelivr, and — the part that
     matters for an app holding children's names and home addresses — connect-src
     means anything that does run cannot send that data anywhere except the five
     services below. It contains a breach rather than preventing one.
     Keep connect-src in step with Router; a new provider added there and not
     here fails silently at runtime.
     No frame-ancestors: browsers ignore it in a meta tag and GitHub Pages
     cannot set response headers, so protection against being framed is simply
     not available here. Listing it anyway would only log a warning and suggest
     a defence that is not there. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://maps.googleapis.com https://maps.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self'; img-src 'self' data: blob: https://*.google.com https://*.googleapis.com https://*.gstatic.com https://*.tile.openstreetmap.org https://cdn.jsdelivr.net; connect-src 'self' https://*.workers.dev https://places.googleapis.com https://maps.googleapis.com https://nominatim.openstreetmap.org https://router.project-osrm.org https://*.hereapi.com https://static.cloudflareinsights.com https://cloudflareinsights.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f7f6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RoutePal">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>RoutePal</title>
<!--
  Fonts are served from this site, not from Google.

  A Google Fonts <link> sends every visitor's IP address to Google before a
  single pixel is drawn. A German court (Munich, January 2022) held that to be
  a GDPR violation on its own, and it needs no consent banner to fix — it
  needs the files to be here. They are, in fonts/.

  Both are variable fonts, so all four weights of each come from ONE file:
  three files in total, about 82KB, and after the first visit none of them are
  fetched again.

  Found while doing this: DM Sans has no Greek subset at all. Greek body text
  has always fallen back to a system font — the app was loading a webfont from
  Google for text it could not render. The unicode-range below says so
  explicitly instead of leaving it to chance.
-->
<style>
  @font-face { font-family:'Syne'; font-style:normal; font-weight:400 800; font-display:swap;
    src:url('fonts/syne-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215; }
  @font-face { font-family:'Syne'; font-style:normal; font-weight:400 800; font-display:swap;
    src:url('fonts/syne-greek.woff2') format('woff2');
    unicode-range:U+0370-0377,U+037A-037F,U+0384-038A,U+038C,U+038E-03A1,U+03A3-03FF; }
  @font-face { font-family:'DM Sans'; font-style:normal; font-weight:100 1000; font-display:swap;
    src:url('fonts/dmsans-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215; }
</style>
<script src="google-maps-config.js" onerror="window.ROUTEPAL_GOOGLE_MAPS_API_KEY=''"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Scheduling progress indicator — a small floating banner, NOT a full-screen
     blocking overlay: you can keep browsing while it runs. Settings saves are
     blocked separately (see App.saveSettings) while this is active, since
     changing settings mid-calculation could corrupt the in-progress run. -->
<div id="sched-overlay" style="display:none;position:fixed;left:50%;bottom:calc(var(--nav-h) + 12px);transform:translateX(-50%);z-index:9999;width:calc(100% - 32px);max-width:calc(var(--max-w) - 32px);transition:opacity .3s ease">
  <div class="sched-card"><div class="sched-row">
    <div class="sched-track" id="sched-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="sched-fill" id="sched-bar"></div>
      <div class="sched-label"><span id="sched-phase">Υπολογισμός…</span><span id="sched-pct">0%</span></div>
      <div class="sched-label on" id="sched-label-on" aria-hidden="true"><span id="sched-phase-on">Υπολογισμός…</span><span id="sched-pct-on">0%</span></div>
    </div>
    <button id="sched-cancel-btn" onclick="App.cancelScheduling()" title="Stop" aria-label="Stop">✕</button>
  </div>
  <div id="sched-sub" class="sched-sub"></div>
  <div id="sched-warn" class="sched-warn"></div>
  </div>
</div>

<div id="app">
  <!-- SCREENS -->
  <div class="screen active" id="screen-home"></div>
  <div class="screen" id="screen-students"></div>
  <div class="screen" id="screen-schedule"></div>
  <div class="screen" id="screen-route"></div>
  <div class="screen" id="screen-settings"></div>

  <!-- BOTTOM NAV -->
  <nav>
    <button class="nav-btn active" data-screen="home" onclick="App.nav('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span id="nav-home-label">Αρχική</span>
    </button>
    <button class="nav-btn" data-screen="students" onclick="App.nav('students')" id="nav-students-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <span id="nav-clients-label">Μαθητές</span><!-- updated by App.updateNavLabels() -->
    </button>
    <div class="nav-fab-slot"><button class="nav-fab" id="nav-fab" type="button" aria-label="+"
      onclick="App.fabClick(event)" onpointerdown="App.fabPress()" onpointerup="App.fabRelease()" onpointerleave="App.fabRelease()"
      oncontextmenu="return false"><b>＋</b><span class="nav-fab-label" id="nav-fab-label"></span></button></div>
    <button class="nav-btn" data-screen="schedule" onclick="App.nav('schedule')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="nav-schedule-label">Πρόγραμμα</span>
    </button>
    <button class="nav-btn" data-screen="settings" onclick="App.nav('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span id="nav-settings-label">Ρυθμίσεις</span>
    </button>
  </nav>
</div>
<div class="fab-menu" id="fab-menu" onclick="if(event.target===this)App.fabClose()"></div>
<div class="overlay" id="fab-sheet-overlay" onclick="if(event.target===this)App.fabSheetClose()">
  <div class="drawer" id="fab-sheet"><div class="drawer-handle"></div><div id="fab-sheet-body"></div></div>
</div>

<!-- DRAWERS -->
<div class="overlay" id="drawer-student-overlay">
  <div class="drawer" id="drawer-student">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <span class="drawer-title" id="drawer-student-title">Νέος</span>
      <button class="btn-icon" onclick="App.closeStudentDrawer()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-student-body"></div>
    <div class="drawer-footer">
      <button class="btn btn-secondary" id="drawer-student-cancel-btn" onclick="App.closeStudentDrawer()" style="flex:1">Άκυρο</button>
      <button class="btn btn-primary" id="drawer-student-save-btn" onclick="App.saveStudent()" style="flex:2">Αποθήκευση</button>
    </div>
  </div>
</div>

<div class="overlay" id="drawer-block-overlay">
  <div class="drawer" id="drawer-block">
    <div class="drawer-handle"></div>
    <div class="drawer-header">
      <span class="drawer-title" id="drawer-block-title">Μπλοκαρισμένη Ώρα</span>
      <button class="btn-icon" onclick="App.closeBlockDrawer()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-block-body"></div>
    <div class="drawer-footer">
      <button class="btn btn-secondary" id="drawer-block-cancel-btn" onclick="App.closeBlockDrawer()" style="flex:1">Άκυρο</button>
      <button class="btn btn-primary" id="drawer-block-save-btn" onclick="App.saveBlock()" style="flex:2">Αποθήκευση</button>
    </div>
  </div>
</div>

<!-- CONFIRM -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirm-title">Επιβεβαίωση</div>
    <div class="confirm-text" id="confirm-text"></div>
    <div class="confirm-actions">
      <button class="btn btn-secondary" style="flex:1" id="confirm-cancel-btn" onclick="App.confirmReject()">Άκυρο</button>
      <button class="btn btn-danger" style="flex:1" id="confirm-ok-btn" onclick="App.confirmAccept()">Διαγραφή</button>
    </div>
  </div>
</div>

<!-- WHO FITS IN A GAP -->
<div class="confirm-overlay" id="gap-overlay">
  <div class="confirm-box" style="max-width:420px">
    <div class="confirm-title" id="gap-title"></div>
    <div class="confirm-text" id="gap-hint" style="margin-bottom:10px"></div>
    <div id="gap-list" style="max-height:50vh;overflow-y:auto"></div>
    <div class="confirm-actions" style="margin-top:10px">
      <button class="btn btn-secondary" style="flex:1" onclick="App.closeGapFill()">Άκυρο</button>
    </div>
  </div>
</div>

<!-- SMART RESCHEDULING: ways to make a refused move fit -->
<div class="confirm-overlay" id="rs-overlay">
  <div class="confirm-box" style="max-width:420px">
    <div class="confirm-title" id="rs-title"></div>
    <div class="confirm-text" id="rs-hint" style="margin-bottom:10px"></div>
    <div id="rs-list" style="max-height:55vh;overflow-y:auto"></div>
    <div class="confirm-actions" style="margin-top:10px">
      <button class="btn btn-secondary" style="flex:1" id="rs-cancel-btn" onclick="App.closeRescheduleOptions()">Άκυρο</button>
    </div>
  </div>
</div>

<!-- SEND TIMES SHEET -->
<div class="confirm-overlay" id="send-overlay">
  <div class="confirm-box" style="max-width:420px">
    <div class="confirm-title" id="send-title">Στείλε τις ώρες</div>
    <div class="confirm-text" id="send-hint" style="margin-bottom:10px"></div>
    <textarea id="send-text" rows="7" style="width:100%;font-size:13px;line-height:1.5;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);resize:vertical"></textarea>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" style="flex:1" id="send-wa-btn" onclick="App.sendVia('whatsapp')">WhatsApp</button>
      <button class="btn btn-secondary" style="flex:1" id="send-sms-btn" onclick="App.sendVia('sms')">SMS</button>
      <button class="btn btn-secondary" style="flex:1" onclick="App.sendVia('copy')">Copy</button>
    </div>
    <div class="confirm-actions" style="margin-top:8px">
      <button class="btn btn-secondary" style="flex:1" onclick="App.closeSendSheet()">Άκυρο</button>
    </div>
  </div>
</div>

<!-- MAP PICKER -->
<div id="map-picker-overlay" style="display:none;position:fixed;inset:0;z-index:3000;background:var(--bg,#f7f6f3);flex-direction:column">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg2)">
    <span style="font-weight:700;font-size:15px" id="map-picker-title"></span>
    <button class="btn-icon" onclick="App.closeMapPicker()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div style="position:relative;flex:1;isolation:isolate">
    <div id="map-picker-map" style="position:absolute;inset:0"></div>
    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;z-index:10">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" style="color:var(--green)" stroke="#fff" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3.5" fill="#fff"/></svg>
    </div>
  </div>
  <div style="padding:12px 16px;border-top:1px solid var(--border);background:var(--bg2)">
    <div id="map-picker-address" style="font-size:12px;color:var(--text2);margin-bottom:10px;min-height:16px;text-align:center"></div>
    <button class="btn btn-primary btn-full" onclick="App.confirmMapPicker()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="map-picker-confirm-label"></span>
    </button>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-container" id="toast-container"></div>

<script src="js/core.js"></script>
<script src="js/calendar-import.js"></script>
<script src="js/client-command.js"></script>
<script src="js/quick-note.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/services.js"></script>
<script src="js/router.js"></script>
<script src="js/progress.js"></script>
<script src="js/app.js"></script>
<script src="js/toast.js"></script>
</body>
</html>
